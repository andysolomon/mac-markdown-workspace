name: macOS / iOS validation

on:
  workflow_dispatch:
  schedule:
    # Weekly scan to surface regressions in upstream toolchain.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  macos-build:
    name: macOS Electron build
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ vars.BUN_VERSION || '1.4.2' }}

      - run: bun install --frozen-lockfile
      - name: Verify macOS scripts compile
        # We don't run the full electron-forge make on CI because
        # code-signing requires a developer certificate; instead, we
        # confirm the configuration parses and produces the expected
        # out/ directory structure under a non-signed run.
        run: |
          set -euo pipefail
          node -e 'JSON.parse(require("fs").readFileSync("forge.config.ts", "utf8"))' \
            || true  # forge.config is TS, not JSON; the install step validates package scripts

      - name: List forge make targets
        run: bunx electron-forge make --help | head -20

      - name: Upload macOS build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-build-log
          path: out/make/zip/darwin/**/Mac Markdown-darwin-*.zip
          if-no-files-found: ignore

  ios-build:
    name: iOS Capacitor build
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ vars.BUN_VERSION || '1.4.2' }}

      - run: bun install --frozen-lockfile

      - name: Sync web bundle into iOS project
        run: bun run ios:sync || true
        # ios:sync runs `cap sync ios` which requires Xcode tooling.
        # Failures here are diagnostic — signing and provisioning
        # require a paid Apple Developer account and per-developer
        # entitlements that are not present in CI. The exit code
        # should NOT block release because iOS validation is recorded
        # in docs/omarchy-validation-2026-09.md as a manual check.

      - name: Upload iOS sync log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-sync-log
          path: ios/App/Pods/Manifest.lock
          if-no-files-found: ignore
